name: Build GlowTTS APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Install cargo-ndk and build tools
        run: |
          cargo install cargo-ndk --locked
          sudo apt-get update && sudo apt-get install -y clang pkg-config libssl-dev perl make curl tar
          sudo rm -rf /usr/local/bin/cmake /usr/local/bin/cmake-real /usr/local/share/cmake-*
          curl -fsSL https://github.com/Kitware/CMake/releases/download/v3.28.6/cmake-3.28.6-linux-x86_64.tar.gz -o /tmp/cmake.tar.gz
          sudo tar -xzf /tmp/cmake.tar.gz -C /usr/local --strip-components=1
          rm -f /tmp/cmake.tar.gz
          cmake --version

      - name: Build native Rust library for Android
        working-directory: rust
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -o ../app/src/main/jniLibs build --release

      - name: Build Android APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GlowTTS-debug-apk
          path: app/build/outputs/apk/debug/*.apk
