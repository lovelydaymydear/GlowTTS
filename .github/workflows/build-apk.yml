name: Build GlowTTS APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Install cargo-ndk and build tools
        run: |
          cargo install cargo-ndk --locked
          sudo apt-get update && sudo apt-get install -y cmake clang pkg-config libssl-dev perl make gradle

      - name: Build native Rust library for Android
        working-directory: rust
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -o ../app/src/main/jniLibs build --release

      - name: Build Android APK
        run: |
          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i 's|gradle-[0-9.]*-bin.zip|gradle-8.7-bin.zip|g' gradle/wrapper/gradle-wrapper.properties
          fi
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GlowTTS-debug-apk
          path: "**/*.apk"
